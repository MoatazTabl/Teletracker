// Add these plugins to the top of your file, after other plugins
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'  // Google Services plugin
    id 'com.google.firebase.crashlytics' // Firebase Crashlytics plugin
}

android {
    // Your existing android configuration
    // ...
    
    // Add this if not already present
    defaultConfig {
        // ...
        multiDexEnabled true
    }
    
    buildTypes {
        release {
            // Add these lines for Crashlytics in release mode
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
            // Your existing release configuration
            // ...
        }
        debug {
            // Enable Crashlytics for debug builds to test
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
        }
    }
}

dependencies {
    // Add these dependencies
    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    
    // Your existing dependencies
    // ...
}